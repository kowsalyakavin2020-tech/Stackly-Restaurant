<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Single Page Apps for GitHub Pages -->
    <!-- https://github.com/rafgraph/spa-github-pages -->
    <!-- This runs BEFORE React mounts. It restores the real URL that -->
    <!-- 404.html redirected, so React Router sees the correct route. -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      })(window.location);
    </script>
    <script type="module" crossorigin src="/Stackly-Restaurant/assets/index-CpWWYeyG.js"></script>
    <link rel="stylesheet" crossorigin href="/Stackly-Restaurant/assets/index-CEkmcmn1.css">
  </head>

  </body>
</html>
